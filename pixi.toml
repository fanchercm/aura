[workspace]
authors = ["mguthriem <guthriem@ornl.gov>"]
channels = ["conda-forge"]
name = "aura"
platforms = ["osx-64"]
version = "0.1.0"

[tasks]
test = "pytest"
lint = "ruff check src/"

[dependencies]
python = ">=3.11"
numpy = ">=1.24.0"
scipy = ">=1.11.0"
matplotlib = ">=3.8.0"
click = ">=8.1.0"
tqdm = ">=4.66.0"
pyyaml = ">=6.0"
pytest = ">=7.4.0"
pytest-cov = ">=4.1.0"
ruff = ">=0.1.0"
mypy = ">=1.5.0"
pip = "*"
